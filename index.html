<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>룰렛 놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}
:root{--page:#f2edf9;color-scheme:light dark}
[hidden]{display:none!important}
body{background:var(--page)}
.view{min-height:100vh;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{flex:1;min-width:0;border:0;border-radius:999px;padding:10px 8px;background:transparent;color:var(--muted);font-family:var(--font-display);font-size:1.05rem;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.v-animal{
  --bg: #f2edf9;
  --surface: #ffffff;
  --fg: #27143d;
  --muted: #6b5a82;
  --line: #ddd2ec;
  --accent: #d92f26;
  --rim: #5b2490;
  --bulb-a: #ffd54a;
  --bulb-b: #fff3cf;
  --dim: rgba(30, 10, 50, 0.38);
  --font-display: 'Jua', 'Noto Sans KR', system-ui, sans-serif;
  --font-body: 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .v-animal{
    --bg: #1b102c; --surface: #2a1a45; --fg: #f4edfc; --muted: #b9a7d1; --line: #46325f;
    --rim: #7a3bc0; --dim: rgba(10, 4, 20, 0.5);
    color-scheme: dark;
  }}
:root[data-theme="dark"] .v-animal{
  --bg: #1b102c; --surface: #2a1a45; --fg: #f4edfc; --muted: #b9a7d1; --line: #46325f;
  --rim: #7a3bc0; --dim: rgba(10, 4, 20, 0.5);
  color-scheme: dark;
}
*{ box-sizing: border-box; }
.v-animal{
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
}
.v-animal .app{
  max-width: 560px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 20px 40px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.v-animal header{ display: flex; flex-direction: column; gap: 2px; }
.v-animal h1{ margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 2.1rem; line-height: 1.15; text-wrap: balance; }
.v-animal .sub{ margin: 0; color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.v-animal .wheel-wrap{ position: relative; width: min(100%, 480px); aspect-ratio: 1; margin-inline: auto; max-width: 100%; }
.v-animal #a-wheel{ position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.v-animal .pointer{ position: absolute; top: -4px; left: 50%; width: 11%; transform: translateX(-50%); z-index: 2; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); pointer-events: none; }
.v-animal .hub{
  position: absolute; left: 50%; top: 50%; width: 25%; aspect-ratio: 1; transform: translate(-50%, -50%);
  border-radius: 50%; border: 5px solid var(--surface); background: var(--accent); color: #fff;
  font-family: var(--font-display); font-size: clamp(1rem, 4.6vw, 1.5rem); cursor: pointer;
  box-shadow: 0 3px 10px rgba(0,0,0,.35); z-index: 3;
  transition: transform .15s ease, opacity .2s ease;
}
.v-animal .hub:hover:not(:disabled){ transform: translate(-50%, -50%) scale(1.05); }
.v-animal .hub:active:not(:disabled){ transform: translate(-50%, -50%) scale(.96); }
.v-animal .hub:disabled{ opacity: .55; cursor: default; }
.v-animal button:focus-visible{ outline: 3px solid var(--fg); outline-offset: 3px; }
.v-animal .hint{ min-height: 1.4em; margin: -10px 0 0; text-align: center; color: var(--muted); font-size: 0.85rem; }
.v-animal .result{
  display: flex; align-items: center; gap: 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px;
  min-height: 116px;
}
.v-animal .result .pic{ flex: none; width: 88px; height: 88px; border-radius: 50%; background: var(--line); display: grid; place-items: center; overflow: hidden; font-family: var(--font-display); font-size: 2.4rem; color: var(--muted); }
.v-animal .result .pic img{ width: 100%; height: 100%; display: block; }
.v-animal .result .txt{ min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.v-animal .result .lbl{ color: var(--muted); font-size: 0.8rem; letter-spacing: .04em; }
.v-animal .result .name{ font-family: var(--font-display); font-size: 1.7rem; line-height: 1.2; overflow-wrap: anywhere; text-wrap: balance; }
.v-animal .result.pop .pic{ animation: pop-a .55s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop-a{ from { transform: scale(.4) rotate(-12deg); } to { transform: scale(1) rotate(0); } }
.v-animal .opts{ display: flex; flex-wrap: wrap; gap: 8px; }
.v-animal .pill{
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px;
  padding: 8px 14px; font: inherit; font-size: 0.88rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
}
.v-animal .pill .dot{ width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; }
.v-animal .pill[aria-pressed="true"]{ border-color: var(--rim); }
.v-animal .pill[aria-pressed="true"] .dot{ background: var(--accent); border-color: var(--accent); }
.v-animal h2{ margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; }
.v-animal .sec-head{ display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.v-animal .link{ border: 0; background: none; color: var(--muted); font: inherit; font-size: 0.85rem; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px 0; }
.v-animal .chips{ display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
@media (min-width: 560px){.v-animal .chips{ grid-template-columns: repeat(6, minmax(0, 1fr)); }}
.v-animal .chip{
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 7px; border-radius: 14px;
  border: 2px solid transparent; background: var(--surface); color: var(--fg); font: inherit; font-size: 0.8rem; cursor: pointer; min-width: 0;
}
.v-animal .chip img{ width: 52px; height: 52px; border-radius: 50%; display: block; transition: filter .2s, opacity .2s; }
.v-animal .chip span{ max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v-animal .chip[aria-pressed="true"]{ border-color: var(--rim); }
.v-animal .chip[aria-pressed="false"]{ color: var(--muted); }
.v-animal .chip[aria-pressed="false"] img{ filter: grayscale(1); opacity: .4; }
.v-animal .chip.next-out{ border-style: dashed; }
.v-animal .hist{ display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.v-animal .hist img{ width: 40px; height: 40px; border-radius: 50%; display: block; }
.v-animal .empty{ color: var(--muted); font-size: 0.88rem; margin: 10px 0 0; }
.v-animal .tally{ margin: 8px 0 0; color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce){.v-animal .result.pop .pic{ animation: none; }
.v-animal .hub{ transition: none; }}
.v-topping{
  --bg: #dce8f8;
  --surface: #ffffff;
  --fg: #12254a;
  --muted: #55688c;
  --line: #bccce6;
  --gold: #f0b429;
  --gold-ink: #2b1a02;
  --dim: rgba(10, 20, 50, 0.45);
  --font-display: 'Jua', 'Noto Sans KR', system-ui, sans-serif;
  --font-body: 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .v-topping{
    --bg: #0b2457; --surface: #123273; --fg: #eef3ff; --muted: #a9bde3; --line: #2a4a8f;
    color-scheme: dark;
  }}
:root[data-theme="dark"] .v-topping{
  --bg: #0b2457; --surface: #123273; --fg: #eef3ff; --muted: #a9bde3; --line: #2a4a8f;
  color-scheme: dark;
}
*{ box-sizing: border-box; }
.v-topping{ background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.v-topping .app{ max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 22px; }
.v-topping header{ display: flex; flex-direction: column; gap: 2px; }
.v-topping h1{ margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 2.1rem; line-height: 1.15; text-wrap: balance; }
.v-topping .sub{ margin: 0; color: var(--muted); font-size: 0.9rem; }
.v-topping .board-wrap{ position: relative; width: min(100%, 480px); aspect-ratio: 1; margin-inline: auto; max-width: 100%; }
.v-topping #t-board{ position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; border-radius: 4%; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.v-topping .go{
  align-self: center; border: 0; border-radius: 999px; padding: 14px 44px; background: var(--gold); color: var(--gold-ink);
  font-family: var(--font-display); font-size: 1.5rem; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.25);
  transition: transform .12s ease;
}
.v-topping .go:active:not(:disabled){ transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.v-topping .go:disabled{ opacity: .55; cursor: default; }
.v-topping button:focus-visible,.v-topping input:focus-visible,.v-topping summary:focus-visible{ outline: 3px solid var(--fg); outline-offset: 3px; }
.v-topping .go-row{ display: flex; flex-direction: column; gap: 8px; margin-top: -6px; }
.v-topping .result{ display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; min-height: 116px; }
.v-topping .result .pic{ flex: none; width: 88px; height: 88px; border-radius: 50%; background: var(--line); display: grid; place-items: center; overflow: hidden; font-family: var(--font-display); font-size: 2.4rem; color: var(--muted); }
.v-topping .result .pic img{ width: 100%; height: 100%; display: block; }
.v-topping .result .txt{ min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.v-topping .result .lbl{ color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.v-topping .result .name{ font-family: var(--font-display); font-size: 1.9rem; line-height: 1.2; overflow-wrap: anywhere; }
.v-topping .result .note{ color: var(--muted); font-size: 0.88rem; }
.v-topping .result.pop .pic{ animation: pop-t .55s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop-t{ from { transform: scale(.4) rotate(-12deg); } to { transform: scale(1) rotate(0); } }
.v-topping .opts{ display: flex; flex-wrap: wrap; gap: 8px; }
.v-topping .pill{ border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 0.88rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.v-topping .pill .dot{ width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); }
.v-topping .pill[aria-pressed="true"] .dot{ background: var(--gold); border-color: var(--gold); }
.v-topping h2{ margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; }
.v-topping .sec-head{ display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.v-topping .link{ border: 0; background: none; color: var(--muted); font: inherit; font-size: 0.85rem; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px 0; }
.v-topping .rows{ display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
@media (min-width: 520px){.v-topping .rows{ grid-template-columns: 1fr 1fr; }}
.v-topping .row{ display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 12px 6px 6px; min-width: 0; }
.v-topping .row img{ width: 40px; height: 40px; border-radius: 50%; flex: none; display: block; }
.v-topping .row input{ flex: 1; min-width: 0; border: 0; border-bottom: 1px dashed var(--line); background: transparent; color: var(--fg); font: inherit; font-size: 1rem; padding: 4px 2px; }
.v-topping .row .pct{ flex: none; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.v-topping .hist{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.v-topping .tag{ display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 4px; font-size: 0.85rem; }
.v-topping .tag img{ width: 24px; height: 24px; border-radius: 50%; display: block; }
.v-topping .empty{ color: var(--muted); font-size: 0.88rem; margin: 10px 0 0; }
.v-topping .tally{ margin: 8px 0 0; color: var(--muted); font-size: 0.82rem; }
@media (prefers-reduced-motion: reduce){.v-topping .result.pop .pic{ animation: none; }
.v-topping .go{ transition: none; }}
</style>
</head>
<body>
<div class="view v-animal" id="view-animal">
<main class="app">
<nav class="tabs" aria-label="룰렛 고르기"><button type="button" data-view="animal" aria-pressed="true">동물 돌림판</button><button type="button" data-view="topping" aria-pressed="false">토핑 룰렛</button></nav>

  <header>
    <h1>동물 돌림판</h1>
    <p class="sub" id="a-sub"></p>
  </header>

  <section>
    <div class="wheel-wrap" id="a-wrap">
      <canvas id="a-wheel" role="img" aria-label="동물 그림이 들어 있는 돌림판"></canvas>
      <svg class="pointer" viewBox="0 0 40 52" aria-hidden="true"><path d="M20 50 L3 8 Q2 2 8 2 L32 2 Q38 2 37 8 Z" fill="#d92f26" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>
      <button class="hub" id="a-spin" type="button">돌리기</button>
    </div>
    <p class="hint" id="a-hint" aria-live="polite"></p>
  </section>

  <section class="result" id="a-result" aria-live="polite">
    <div class="pic" id="a-pic">?</div>
    <div class="txt">
      <span class="lbl" id="a-lbl">뽑힌 동물</span>
      <span class="name" id="a-name">돌림판을 돌려 보세요</span>
    </div>
  </section>

  <div class="opts">
    <button class="pill" id="a-optExclude" type="button" aria-pressed="false"><span class="dot"></span>뽑힌 동물은 다음 판에서 빼기</button>
    <button class="pill" id="a-optSound" type="button" aria-pressed="true"><span class="dot"></span>소리</button>
  </div>

  <section>
    <div class="sec-head">
      <h2>돌림판에 넣을 동물</h2>
      <button class="link" id="a-resetAll" type="button">모두 다시 넣기</button>
    </div>
    <div class="chips" id="a-chips"></div>
  </section>

  <section>
    <div class="sec-head">
      <h2>뽑힌 기록</h2>
      <button class="link" id="a-clearHist" type="button">기록 지우기</button>
    </div>
    <div id="a-histBox"></div>
  </section>
</main>
</div>
<div class="view v-topping" id="view-topping" hidden>
<main class="app">
<nav class="tabs" aria-label="룰렛 고르기"><button type="button" data-view="animal" aria-pressed="false">동물 돌림판</button><button type="button" data-view="topping" aria-pressed="true">토핑 룰렛</button></nav>

  <header>
    <h1>토핑 룰렛</h1>
    <p class="sub">화살표가 멈춘 칸이 나와요. 칸이 넓을수록 자주 나와요.</p>
  </header>

  <section>
    <div class="board-wrap" id="t-wrap">
      <canvas id="t-board" role="img" aria-label="나무 판 위의 여덟 칸 룰렛과 돌아가는 화살표"></canvas>
    </div>
  </section>

  <div class="go-row">
    <button class="go" id="t-spin" type="button">돌리기</button>
  </div>

  <section class="result" id="t-result" aria-live="polite">
    <div class="pic" id="t-pic">?</div>
    <div class="txt">
      <span class="lbl" id="t-lbl">나온 칸</span>
      <span class="name" id="t-name">룰렛을 돌려 보세요</span>
      <span class="note" id="t-note"></span>
    </div>
  </section>

  <div class="opts">
    <button class="pill" id="t-optSound" type="button" aria-pressed="true"><span class="dot"></span>소리</button>
  </div>

  <section>
    <div class="sec-head">
      <h2>칸 이름</h2>
      <button class="link" id="t-resetNames" type="button">이름 처음대로</button>
    </div>
    <div class="rows" id="t-rows"></div>
  </section>

  <section>
    <div class="sec-head">
      <h2>나온 기록</h2>
      <button class="link" id="t-clearHist" type="button">기록 지우기</button>
    </div>
    <div id="t-histBox"></div>
  </section>
</main>
</div>

const ANIMALS = [
  { id: 'frog', name: '개구리' }, { id: 'ladybug', name: '무당벌레' }, { id: 'pig', name: '돼지' },
  { id: 'penguin', name: '펭귄' }, { id: 'butterfly', name: '나비' }, { id: 'hippo', name: '하마' },
  { id: 'fish', name: '물고기' }, { id: 'zebra', name: '얼룩말' }, { id: 'rooster', name: '닭' },
  { id: 'elephant', name: '코끼리' }, { id: 'bee', name: '벌' }, { id: 'giraffe', name: '기린' },
  { id: 'sheep', name: '양' }, { id: 'kangaroo', name: '캥거루' }, { id: 'echidna', name: '바늘두더지' },
  { id: 'cow', name: '소' }, { id: 'bird', name: '파랑새' }, { id: 'croc', name: '악어' }
].map(a => ({ ...a, src: SRC[a.id] }));
const BY_ID = Object.fromEntries(ANIMALS.map(a => [a.id, a]));
const SLICE = ['#e5372d', '#7b3fa8', '#f2a21d', '#4fa32e', '#2f86d6', '#d6338a'];
const TAU = Math.PI * 2;

const $ = id => document.getElementById('a-' + id);
const wrap = $('wrap'), cv = $('wheel'), ctx = cv.getContext('2d');
const spinBtn = $('spin'), hint = $('hint');

let active = new Set(ANIMALS.map(a => a.id));
let history = [];
let theta = 0, hi = -1, spinning = false;
let excludeOn = false, soundOn = true, pendingOut = null;

const imgs = {};
let loaded = 0;
ANIMALS.forEach(a => {
  const im = new Image();
  im.onload = () => { loaded++; draw(); };
  im.src = a.src;
  imgs[a.id] = im;
});

const list = () => ANIMALS.filter(a => active.has(a.id));
const mod = (x, m) => ((x % m) + m) % m;
function josa(w) {
  const c = w.charCodeAt(w.length - 1);
  return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0 ? '이' : '가';
}
function sliceColor(i, n) {
  let k = i % SLICE.length;
  if (n > 1 && i === n - 1 && k === 0) k = 3;
  return SLICE[k];
}

/* 그리기 */
function fit() {
  const w = wrap.clientWidth;
  if (!w) return;
  const d = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = cv.height = Math.round(w * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
  draw();
}
function draw() {
  const W = wrap.clientWidth;
  if (!W) return;
  const cs = getComputedStyle(document.documentElement);
  const rimC = cs.getPropertyValue('--rim').trim();
  const dimC = cs.getPropertyValue('--dim').trim();
  const bulbA = cs.getPropertyValue('--bulb-a').trim();
  const bulbB = cs.getPropertyValue('--bulb-b').trim();
  const cx = W / 2, cy = W / 2;
  const rim = W * 0.055;
  const R = W / 2 - rim - 2;
  ctx.clearRect(0, 0, W, W);

  ctx.beginPath(); ctx.arc(cx, cy, W / 2 - 1, 0, TAU); ctx.fillStyle = rimC; ctx.fill();
  const blink = spinning ? Math.floor(performance.now() / 160) % 2 : 0;
  const bulbs = 28;
  for (let b = 0; b < bulbs; b++) {
    const ang = b / bulbs * TAU;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(ang) * (W / 2 - rim / 2 - 1), cy + Math.sin(ang) * (W / 2 - rim / 2 - 1), rim * 0.2, 0, TAU);
    ctx.fillStyle = (b + blink) % 2 ? bulbA : bulbB;
    ctx.fill();
  }

  const items = list(), n = items.length;
  if (!n) return;
  const a = TAU / n;
  for (let i = 0; i < n; i++) {
    const s = -Math.PI / 2 + theta + i * a;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, s, s + a); ctx.closePath();
    ctx.fillStyle = sliceColor(i, n); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
  }
  const rp = R * 0.7;
  const size = Math.min(R * 0.36, 2 * Math.PI * rp / n * 0.86);
  for (let i = 0; i < n; i++) {
    const m = -Math.PI / 2 + theta + (i + 0.5) * a;
    const px = cx + Math.cos(m) * rp, py = cy + Math.sin(m) * rp;
    const im = imgs[items[i].id];
    if (im && im.complete && im.naturalWidth) {
      ctx.save();
      ctx.beginPath(); ctx.arc(px, py, size / 2, 0, TAU); ctx.clip();
      ctx.drawImage(im, px - size / 2, py - size / 2, size, size);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(px, py, size / 2, 0, TAU);
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
  }
  if (hi >= 0 && hi < n) {
    for (let i = 0; i < n; i++) {
      if (i === hi) continue;
      const s = -Math.PI / 2 + theta + i * a;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, s, s + a); ctx.closePath();
      ctx.fillStyle = dimC; ctx.fill();
    }
    const s = -Math.PI / 2 + theta + hi * a;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R - 2, s, s + a); ctx.closePath();
    ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round'; ctx.stroke();
  }
}

/* 소리 */
let ac = null;
function audio() {
  if (!soundOn) return null;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  } catch (e) { return null; }
}
function beep(freq, dur, type, vol, when) {
  const c = audio(); if (!c) return;
  const t = c.currentTime + (when || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
let lastTick = 0;
function tick() {
  const now = performance.now();
  if (now - lastTick < 35) return;
  lastTick = now;
  beep(880, 0.04, 'square', 0.05);
}
function winSound() { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.22, 'triangle', 0.12, i * 0.1)); }

/* 돌리기 */
function spin() {
  if (spinning) return;
  if (pendingOut) { active.delete(pendingOut); pendingOut = null; renderChips(); }
  const items = list(), n = items.length;
  if (n < 2) { updateUI(); return; }
  audio();
  spinning = true; hi = -1;
  updateUI();
  const a = TAU / n;
  const t = Math.floor(Math.random() * n);
  const jitter = (Math.random() * 0.7 - 0.35) * a;
  const want = mod(-((t + 0.5) * a + jitter), TAU);
  const start = mod(theta, TAU);
  const minF = start + TAU * (5 + Math.floor(Math.random() * 3));
  const final = minF + mod(want - minF, TAU);
  const dur = 5600;
  const t0 = performance.now();
  let lastIdx = Math.floor(-start / a);
  const frame = now => {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 4);
    theta = start + (final - start) * e;
    const idx = Math.floor(-theta / a);
    if (idx !== lastIdx) { lastIdx = idx; tick(); }
    draw();
    if (p < 1) requestAnimationFrame(frame); else finish(t, final);
  };
  requestAnimationFrame(frame);
}
function finish(t, final) {
  spinning = false;
  theta = mod(final, TAU);
  hi = t;
  const w = list()[t];
  draw();
  history.unshift(w.id);
  showResult(w);
  renderHistory();
  winSound();
  try { navigator.vibrate && navigator.vibrate(40); } catch (e) {}
  if (excludeOn) { pendingOut = w.id; }
  renderChips();
  updateUI();
}

/* 화면 갱신 */
function showResult(w) {
  const box = $('result');
  $('pic').innerHTML = '<img alt="" src="' + w.src + '">';
  $('lbl').textContent = '뽑힌 동물';
  $('name').textContent = w.name + josa(w.name) + ' 뽑혔어요!';
  box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
}
function updateUI() {
  const n = list().length;
  $('sub').textContent = n + '마리 중 한 마리를 뽑아요';
  spinBtn.disabled = spinning || n < 2;
  spinBtn.textContent = spinning ? '...' : '돌리기';
  if (n < 2) hint.textContent = '동물을 2마리 이상 넣어 주세요';
  else if (pendingOut) hint.textContent = BY_ID[pendingOut].name + '은(는) 다음 판에서 빠져요';
  else hint.textContent = '';
}
function renderChips() {
  const box = $('chips');
  box.innerHTML = '';
  ANIMALS.forEach(a => {
    const on = active.has(a.id);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (pendingOut === a.id ? ' next-out' : '');
    b.id = 'chip-' + a.id;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.innerHTML = '<img alt="" src="' + a.src + '"><span>' + a.name + '</span>';
    b.addEventListener('click', () => toggle(a.id));
    box.appendChild(b);
  });
}
function toggle(id) {
  if (spinning) return;
  if (active.has(id)) {
    if (active.size <= 2) { hint.textContent = '돌림판에는 2마리 이상 있어야 해요'; return; }
    active.delete(id);
    if (pendingOut === id) pendingOut = null;
  } else active.add(id);
  hi = -1;
  renderChips(); updateUI(); draw();
}
function renderHistory() {
  const box = $('histBox');
  if (!history.length) { box.innerHTML = '<p class="empty">아직 기록이 없어요. 돌림판을 돌려 보세요.</p>'; return; }
  const counts = {};
  history.forEach(id => counts[id] = (counts[id] || 0) + 1);
  const top = Object.entries(counts).sort((x, y) => y[1] - x[1])[0];
  box.innerHTML = '<div class="hist">' + history.slice(0, 24).map(id =>
    '<img alt="' + BY_ID[id].name + '" title="' + BY_ID[id].name + '" src="' + BY_ID[id].src + '">').join('') +
    '</div><p class="tally">' + history.length + '번 돌렸고, 가장 많이 나온 동물은 ' + BY_ID[top[0]].name + '(' + top[1] + '번)이에요.</p>';
}

/* 이벤트 */
spinBtn.addEventListener('click', spin);
function pill(id, get, set) {
  const el = $(id);
  el.addEventListener('click', () => { set(!get()); el.setAttribute('aria-pressed', get() ? 'true' : 'false'); });
}
pill('optExclude', () => excludeOn, v => { excludeOn = v; if (!v && pendingOut) { pendingOut = null; renderChips(); updateUI(); } });
pill('optSound', () => soundOn, v => { soundOn = v; });
$('resetAll').addEventListener('click', () => {
  if (spinning) return;
  active = new Set(ANIMALS.map(a => a.id)); pendingOut = null; hi = -1;
  renderChips(); updateUI(); draw();
});
$('clearHist').addEventListener('click', () => { history = []; renderHistory(); });

new ResizeObserver(() => requestAnimationFrame(fit)).observe(wrap);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

renderChips(); renderHistory(); updateUI(); fit();

})();
</script>
<script>
(function () {

const TAU = Math.PI * 2, DEG = Math.PI / 180;
const OFFSET = 8.5 * DEG;
/* 칸 넓이(도)는 사진 속 룰렛에서 잰 값이에요. 위쪽 경계에서 시계 방향으로 나열해요. */
const DEFAULTS = {
  naruto: '어묵', red: '피망', noodle: '누들', sausage: '고추',
  egg: '계란', any: '아무거나', peas: '콩', carrot: '당근'
};
const SECTIONS = [
  { id: 'naruto',  span: 39.5, base: '#a95fc4', deco: '#f08fc8', type: 'naruto' },
  { id: 'red',     span: 28.4, base: '#e0262c', deco: '#b01c21', type: 'pepper' },
  { id: 'noodle',  span: 83.6, base: '#e9b52f', deco: '#c58a1a', type: 'noodle' },
  { id: 'sausage', span: 24.0, base: '#a32320', deco: '#6b1313', type: 'chili' },
  { id: 'egg',     span: 51.7, base: '#f2c43c', deco: '#fae58a', type: 'egg' },
  { id: 'any',     span: 46.8, base: '#55a7e3', deco: '#2d76c2', type: 'star' },
  { id: 'peas',    span: 44.3, base: '#3fa73a', deco: '#2a7f27', type: 'peas' },
  { id: 'carrot',  span: 41.7, base: '#f26f24', deco: '#cb4912', type: 'carrot' }
];
let acc = OFFSET;
SECTIONS.forEach(s => { s.start = acc; s.end = acc + s.span * DEG; acc = s.end; s.label = DEFAULTS[s.id]; s.pct = Math.round(s.span / 360 * 100); });

try {
  const saved = JSON.parse(localStorage.getItem('topping-labels-2') || '{}');
  SECTIONS.forEach(s => { if (typeof saved[s.id] === 'string' && saved[s.id].trim()) s.label = saved[s.id].slice(0, 8); });
} catch (e) {}
function saveLabels() {
  try { const o = {}; SECTIONS.forEach(s => o[s.id] = s.label); localStorage.setItem('topping-labels-2', JSON.stringify(o)); } catch (e) {}
}

const $ = id => document.getElementById('t-' + id);
const wrap = $('wrap'), cv = $('board'), ctx = cv.getContext('2d');
const spinBtn = $('spin');
const mod = (x, m) => ((x % m) + m) % m;
function sectionAt(phi) {
  const a = mod(phi - OFFSET, TAU);
  let c = 0;
  for (let i = 0; i < SECTIONS.length; i++) { c += SECTIONS[i].span * DEG; if (a < c) return i; }
  return SECTIONS.length - 1;
}

/* 토핑 그림. full이면 실제 색으로, 아니면 칸 안 무늬로 한 가지 색만 써요. */
function motif(c, type, x, y, s, rot, full, deco, base) {
  c.save(); c.translate(x, y); c.rotate(rot); c.lineCap = 'round'; c.lineJoin = 'round';
  if (type === 'peas') {
    const n = 5;
    for (let k = 0; k < n; k++) {
      const t = k / (n - 1) - 0.5;
      const px = t * s * 1.0, py = t * t * s * 0.4 - s * 0.06, r = s * 0.17;
      c.beginPath(); c.arc(px, py, r, 0, TAU); c.fillStyle = full ? '#1f9a2e' : deco; c.fill();
      if (full) {
        c.lineWidth = s * 0.015; c.strokeStyle = '#13731f'; c.stroke();
        c.beginPath(); c.arc(px - r * 0.3, py - r * 0.35, r * 0.22, 0, TAU); c.fillStyle = 'rgba(255,255,255,.45)'; c.fill();
      }
    }
  } else if (type === 'carrot') {
    c.beginPath(); c.roundRect(-s * 0.5, -s * 0.085, s, s * 0.17, s * 0.03); c.fillStyle = full ? '#f68a1d' : deco; c.fill();
    if (full) {
      c.strokeStyle = 'rgba(190,80,10,.55)'; c.lineWidth = s * 0.012;
      [-0.38, -0.02].forEach(px => { c.beginPath(); c.arc(px * s, 0, s * 0.045, 0, TAU); c.stroke(); });
      c.beginPath(); c.arc(0.4 * s, 0, s * 0.04, 0, TAU); c.stroke();
    }
  } else if (type === 'naruto') {
    c.beginPath();
    for (let i = 0; i <= 240; i++) { const t = i / 240 * TAU, r = s * 0.36 + s * 0.06 * Math.abs(Math.sin(6 * t)); const px = Math.cos(t) * r, py = Math.sin(t) * r; i ? c.lineTo(px, py) : c.moveTo(px, py); }
    c.closePath(); c.fillStyle = full ? '#f4f2f7' : deco; c.fill();
    if (full) { c.strokeStyle = '#cfcbd6'; c.lineWidth = s * 0.015; c.stroke(); }
    c.beginPath(); c.lineCap = 'butt';
    for (let i = 0; i <= 80; i++) { const t = i / 80, a = 0.3 + t * 2.3 * TAU, r = s * 0.04 + t * s * 0.26; const px = Math.cos(a) * r, py = Math.sin(a) * r; i ? c.lineTo(px, py) : c.moveTo(px, py); }
    c.strokeStyle = full ? '#8f3b7f' : base; c.lineWidth = s * 0.085; c.stroke();
  } else if (type === 'pepper') {
    c.beginPath();
    const gap = 0.3;
    for (let i = 0; i <= 160; i++) {
      const t = 0.9 + gap + i / 160 * (TAU - 2 * gap), r = s * 0.34 * (1 + 0.26 * Math.cos(4 * t));
      const px = Math.cos(t) * r, py = Math.sin(t) * r; i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.strokeStyle = full ? '#e8261f' : deco; c.lineWidth = s * 0.12; c.stroke();
  } else if (type === 'chili') {
    c.beginPath();
    c.moveTo(-s * 0.46, -s * 0.12);
    c.bezierCurveTo(-s * 0.2, -s * 0.2, s * 0.25, -s * 0.15, s * 0.48, -s * 0.04);
    c.quadraticCurveTo(s * 0.53, 0, s * 0.48, s * 0.04);
    c.bezierCurveTo(s * 0.25, s * 0.15, -s * 0.2, s * 0.2, -s * 0.46, s * 0.12);
    c.closePath(); c.fillStyle = full ? '#8a1018' : deco; c.fill();
    if (full) {
      c.fillStyle = '#1e6b2b'; c.beginPath(); c.roundRect(-s * 0.52, -s * 0.08, s * 0.08, s * 0.16, s * 0.03); c.fill();
      c.beginPath(); c.ellipse(-s * 0.08, -s * 0.09, s * 0.2, s * 0.03, 0.05, 0, TAU); c.fillStyle = 'rgba(255,180,180,.6)'; c.fill();
    }
  } else if (type === 'noodle') {
    c.beginPath();
    for (let i = 0; i <= 60; i++) { const t = i / 60 - 0.5; const px = t * s * 1.15, py = Math.sin(t * TAU * 2.0) * s * 0.2; i ? c.lineTo(px, py) : c.moveTo(px, py); }
    c.strokeStyle = full ? '#f0a622' : deco; c.lineWidth = s * 0.12; c.stroke();
  } else if (type === 'egg') {
    c.beginPath(); c.ellipse(0, 0, s * 0.5, s * 0.4, 0, 0, TAU);
    if (full) { c.fillStyle = '#f6f5fa'; c.fill(); c.strokeStyle = '#c9c6d0'; c.lineWidth = s * 0.02; c.stroke(); }
    else { c.strokeStyle = deco; c.lineWidth = s * 0.07; c.stroke(); }
    c.beginPath(); c.ellipse(s * 0.06, -s * 0.02, s * 0.29, s * 0.25, 0, 0, TAU); c.fillStyle = full ? '#e8d81c' : deco; c.fill();
  } else if (type === 'star') {
    c.beginPath();
    for (let i = 0; i < 10; i++) { const a = i / 10 * TAU - Math.PI / 2, r = i % 2 ? s * 0.2 : s * 0.46; const px = Math.cos(a) * r, py = Math.sin(a) * r; i ? c.lineTo(px, py) : c.moveTo(px, py); }
    c.closePath(); c.fillStyle = full ? '#2d76c2' : deco; c.fill();
  }
  c.restore();
}

/* 목록·결과에 쓰는 동그란 그림 */
const icons = {};
function makeIcons() {
  SECTIONS.forEach(s => {
    const o = document.createElement('canvas'); o.width = o.height = 192;
    const c = o.getContext('2d');
    c.beginPath(); c.arc(96, 96, 92, 0, TAU); c.fillStyle = '#ffffff'; c.fill();
    c.lineWidth = 12; c.strokeStyle = s.base; c.stroke();
    motif(c, s.type, 96, 96, 118, s.type === 'carrot' ? -0.6 : s.type === 'chili' ? -0.4 : 0, true, s.deco, s.base);
    icons[s.id] = o.toDataURL('image/png');
  });
}

/* 판 그리기 */
let boardCache = null;
function drawBoard(c, W) {
  const rr = W * 0.04;
  c.beginPath(); c.roundRect(0, 0, W, W, rr); c.fillStyle = '#d9a62a'; c.fill();
  const ins = W * 0.03;
  c.save();
  c.beginPath(); c.roundRect(ins, ins, W - 2 * ins, W - 2 * ins, rr * 0.5); c.clip();
  const planks = 7, pw = (W - 2 * ins) / planks;
  for (let i = 0; i < planks; i++) {
    c.fillStyle = i % 2 ? '#7f4f2c' : '#75462a'; c.fillRect(ins + i * pw, ins, pw + 1, W);
    c.fillStyle = 'rgba(40,20,8,.35)'; c.fillRect(ins + i * pw, ins, 2, W);
    c.strokeStyle = 'rgba(40,20,8,.18)'; c.lineWidth = 1.5; c.beginPath();
    c.moveTo(ins + i * pw + pw * 0.3, ins + W * 0.05); c.bezierCurveTo(ins + i * pw + pw * 0.45, W * 0.3, ins + i * pw + pw * 0.2, W * 0.6, ins + i * pw + pw * 0.4, W * 0.9); c.stroke();
  }
  c.restore();

  const cx = W / 2, R = W * 0.43;
  c.save(); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = W * 0.02; c.shadowOffsetY = W * 0.008;
  c.beginPath(); c.arc(cx, cx, R, 0, TAU); c.fillStyle = '#ffffff'; c.fill(); c.restore();

  SECTIONS.forEach((s, i) => {
    const a0 = s.start - Math.PI / 2, a1 = s.end - Math.PI / 2;
    c.beginPath(); c.moveTo(cx, cx); c.arc(cx, cx, R, a0, a1); c.closePath(); c.fillStyle = s.base; c.fill();
    c.save(); c.beginPath(); c.moveTo(cx, cx); c.arc(cx, cx, R, a0, a1); c.closePath(); c.clip();
    c.globalAlpha = 0.5;
    const unit = R * 0.14, span = s.end - s.start;
    [0.36, 0.55, 0.74, 0.9].forEach((rf, ri) => {
      const arc = span * rf * R;
      const cnt = Math.max(1, Math.floor(arc / (unit * 1.9)));
      const sz = Math.min(unit * 1.3, arc / cnt * 0.85 + (cnt === 1 ? unit * 0.2 : 0));
      for (let k = 0; k < cnt; k++) {
        const ang = s.start + span * (k + 0.5) / cnt - Math.PI / 2 + (cnt > 1 && ri % 2 ? span / cnt * 0.15 : 0);
        const rot = ((i * 47 + k * 31 + ri * 53) % 360) * DEG;
        motif(c, s.type, cx + Math.cos(ang) * rf * R, cx + Math.sin(ang) * rf * R, sz, rot, false, s.deco, s.base);
      }
    });
    c.restore();
  });
  c.beginPath(); c.arc(cx, cx, R, 0, TAU); c.lineWidth = 2; c.strokeStyle = 'rgba(0,0,0,.2)'; c.stroke();
}

/* 화살표 */
function drawArrow(c, W, phi) {
  const cx = W / 2, R = W * 0.43;
  const dx = Math.sin(phi), dy = -Math.cos(phi);
  const px = -dy, py = dx;
  const L = R * 0.6, amp = R * 0.05;
  c.save(); c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = W * 0.012; c.shadowOffsetY = W * 0.006;
  c.lineCap = 'round'; c.lineJoin = 'round';
  const path = () => {
    c.beginPath();
    for (let i = 0; i <= 50; i++) {
      const t = i / 50, a = t * L, w = Math.sin(t * TAU * 2.5) * amp * Math.min(1, t * 4);
      const x = cx + dx * a + px * w, y = cx + dy * a + py * w;
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
  };
  path(); c.strokeStyle = '#b88714'; c.lineWidth = R * 0.085; c.stroke();
  path(); c.strokeStyle = '#f5cb48'; c.lineWidth = R * 0.052; c.stroke();
  const hl = R * 0.17, hw = R * 0.085;
  const bx = cx + dx * L, by = cx + dy * L;
  const tri = () => { c.beginPath(); c.moveTo(bx + dx * hl, by + dy * hl); c.lineTo(bx + px * hw, by + py * hw); c.lineTo(bx - px * hw, by - py * hw); c.closePath(); };
  tri(); c.fillStyle = '#f5cb48'; c.fill(); c.lineWidth = R * 0.03; c.strokeStyle = '#b88714'; c.stroke();
  c.beginPath(); c.arc(cx, cx, R * 0.095, 0, TAU); c.fillStyle = '#f5cb48'; c.fill(); c.lineWidth = R * 0.03; c.strokeStyle = '#b88714'; c.stroke();
  c.beginPath(); c.arc(cx, cx, R * 0.045, 0, TAU); c.fillStyle = '#d9a62a'; c.fill();
  c.restore();
}

let phi = 20 * DEG, hi = -1, spinning = false, soundOn = true;
function fit() {
  const W = wrap.clientWidth;
  if (!W) return;
  const d = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = cv.height = Math.round(W * d);
  boardCache = document.createElement('canvas');
  boardCache.width = boardCache.height = cv.width;
  const bc = boardCache.getContext('2d');
  bc.setTransform(d, 0, 0, d, 0, 0);
  drawBoard(bc, W);
  ctx.setTransform(d, 0, 0, d, 0, 0);
  draw();
}
function draw() {
  const W = wrap.clientWidth;
  if (!W || !boardCache) return;
  ctx.clearRect(0, 0, W, W);
  ctx.drawImage(boardCache, 0, 0, W, W);
  const cx = W / 2, R = W * 0.43;
  if (hi >= 0) {
    const dim = getComputedStyle(document.documentElement).getPropertyValue('--dim').trim() || 'rgba(0,0,0,.4)';
    SECTIONS.forEach((s, i) => {
      if (i === hi) return;
      ctx.beginPath(); ctx.moveTo(cx, cx); ctx.arc(cx, cx, R, s.start - Math.PI / 2, s.end - Math.PI / 2); ctx.closePath();
      ctx.fillStyle = dim; ctx.fill();
    });
    const w = SECTIONS[hi];
    ctx.beginPath(); ctx.moveTo(cx, cx); ctx.arc(cx, cx, R - 3, w.start - Math.PI / 2, w.end - Math.PI / 2); ctx.closePath();
    ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.strokeStyle = '#ffffff'; ctx.stroke();
  }
  drawArrow(ctx, W, phi);
}

/* 소리 */
let ac = null;
function audio() {
  if (!soundOn) return null;
  try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; } catch (e) { return null; }
}
function beep(freq, dur, type, vol, when) {
  const c = audio(); if (!c) return;
  const t = c.currentTime + (when || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
}
let lastTick = 0;
function tick() { const n = performance.now(); if (n - lastTick < 40) return; lastTick = n; beep(820, 0.04, 'square', 0.05); }
function winSound() { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.22, 'triangle', 0.12, i * 0.1)); }

/* 돌리기: 화살표가 멈춘 자리가 곧 결과예요. 칸 넓이가 확률이에요. */
let history = [];
function spin() {
  if (spinning) return;
  audio();
  spinning = true; hi = -1; spinBtn.disabled = true; spinBtn.textContent = '...';
  const start = phi;
  const final = start + TAU * (4 + Math.random() * 3);
  const dur = 4800, t0 = performance.now();
  let last = sectionAt(start);
  const frame = now => {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    phi = start + (final - start) * e;
    const k = sectionAt(phi);
    if (k !== last) { last = k; tick(); }
    draw();
    if (p < 1) requestAnimationFrame(frame); else finish(final);
  };
  requestAnimationFrame(frame);
}
function finish(final) {
  spinning = false;
  phi = mod(final, TAU);
  hi = sectionAt(phi);
  draw();
  history.unshift(hi);
  showResult(hi);
  renderHistory();
  winSound();
  try { navigator.vibrate && navigator.vibrate(40); } catch (e) {}
  spinBtn.disabled = false; spinBtn.textContent = '돌리기';
}

function showResult(i) {
  const s = SECTIONS[i], box = $('result');
  $('pic').innerHTML = '<img alt="" src="' + icons[s.id] + '">';
  $('lbl').textContent = '나온 칸 · 확률 ' + s.pct + '%';
  $('name').textContent = s.label;
  $('note').textContent = s.id === 'any' ? '마음대로 골라도 돼요!' : '';
  box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
}
function renderRows() {
  const box = $('rows'); box.innerHTML = '';
  SECTIONS.forEach((s, i) => {
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = '<img alt="" src="' + icons[s.id] + '"><input id="name-' + s.id + '" type="text" maxlength="8" aria-label="칸 이름" value=""><span class="pct">' + s.pct + '%</span>';
    const inp = r.querySelector('input'); inp.value = s.label;
    inp.addEventListener('input', () => {
      s.label = inp.value.trim() || DEFAULTS[s.id];
      saveLabels(); renderHistory();
      if (hi === i) $('name').textContent = s.label;
    });
    box.appendChild(r);
  });
}
function renderHistory() {
  const box = $('histBox');
  if (!history.length) { box.innerHTML = '<p class="empty">아직 기록이 없어요. 룰렛을 돌려 보세요.</p>'; return; }
  box.innerHTML = '<div class="hist">' + history.slice(0, 24).map(i =>
    '<span class="tag"><img alt="" src="' + icons[SECTIONS[i].id] + '">' + SECTIONS[i].label.replace(/[<>&]/g, '') + '</span>').join('') +
    '</div><p class="tally">' + history.length + '번 돌렸어요.</p>';
}

spinBtn.addEventListener('click', spin);
cv.addEventListener('click', spin);
$('optSound').addEventListener('click', e => { soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', soundOn ? 'true' : 'false'); });
$('resetNames').addEventListener('click', () => { SECTIONS.forEach(s => s.label = DEFAULTS[s.id]); saveLabels(); renderRows(); renderHistory(); if (hi >= 0) showResult(hi); });
$('clearHist').addEventListener('click', () => { history = []; renderHistory(); });

new ResizeObserver(() => requestAnimationFrame(fit)).observe(wrap);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

makeIcons(); renderRows(); renderHistory(); fit();

})();
</script>
<script>
(function () {
  const views = { animal: document.getElementById('view-animal'), topping: document.getElementById('view-topping') };
  let current = 'animal';
  function sync() { document.documentElement.style.setProperty('--page', getComputedStyle(views[current]).backgroundColor); }
  function show(name, save) {
    current = name;
    Object.keys(views).forEach(k => { views[k].hidden = k !== name; });
    sync();
    if (save) { try { localStorage.setItem('roulette-view', name); } catch (e) {} window.scrollTo(0, 0); }
  }
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => show(b.dataset.view, true)));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', sync);
  new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  let saved = 'animal';
  try { saved = localStorage.getItem('roulette-view') === 'topping' ? 'topping' : 'animal'; } catch (e) {}
  show(saved, false);
})();
</script>
</body>
